name: Build Sensar Android

on:
  push:
    branches: [sensar-android]
    paths:
      - 'android-build/project.part*'
      - '.github/workflows/build-sensar-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install current Android command-line tools
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fL --retry 4 --retry-delay 2 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o /tmp/cmdline-tools.zip
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/cmdline-tools.zip' | sha256sum -c -
          rm -rf /tmp/android-cli && mkdir -p /tmp/android-cli
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android 17 Preview SDK with Android CLI
        shell: bash
        run: |
          set -euxo pipefail
          android --sdk="$ANDROID_SDK_ROOT" sdk install --canary platforms/android-37.0 build-tools/37.0.0 platform-tools
          android --sdk="$ANDROID_SDK_ROOT" sdk list --canary 'platforms/*' || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore and patch project
        shell: bash
        run: |
          set -euxo pipefail
          cat android-build/project.part00 android-build/project.part01 android-build/project.part02 android-build/project.part03 android-build/project.part04 | base64 -d > /tmp/sensar-android.tar.gz
          echo '4a3824f61389aae774b7fbb680feb59b4d3e847dc06e0d87707d430775a54dc0  /tmp/sensar-android.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sensar-android.tar.gz
          sed -i "s/version '8.10.1'/version '9.3.0'/" SensarTranslate-Android-v0.1.0/build.gradle
          sed -i 's/import android.graphics.HardwareBuffer;/import android.hardware.HardwareBuffer;/' SensarTranslate-Android-v0.1.0/app/src/main/java/com/sensar/translate/SensarAccessibilityService.java
          python - <<'PY'
          from pathlib import Path
          p=Path('SensarTranslate-Android-v0.1.0/app/src/main/java/com/sensar/translate/SensarAccessibilityService.java')
          s=p.read_text()
          old="""    private void showBottom(View v){\n        removeOverlay();overlay=v;overlayLp=new WindowManager.LayoutParams(-1,-2,WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN|WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,android.graphics.PixelFormat.TRANSLUCENT);overlayLp.gravity=Gravity.BOTTOM|Gravity.START;overlayLp.x=0;overlayLp.y=dp(12);wm.addView(v,overlayLp);\n    }\n"""
          new="""    private void showBottom(View v){\n        removeOverlay();\n        int screenW=getResources().getDisplayMetrics().widthPixels;\n        int width=Math.max(dp(280),screenW-dp(24));\n        overlay=v;\n        overlayLp=new WindowManager.LayoutParams(width,-2,WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN|WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,android.graphics.PixelFormat.TRANSLUCENT);\n        overlayLp.gravity=Gravity.BOTTOM|Gravity.CENTER_HORIZONTAL;overlayLp.x=0;overlayLp.y=dp(12);\n        wm.addView(v,overlayLp);\n    }\n"""
          old2="""    private void makeDraggable(View handle){\n        final float[] d=new float[4];handle.setOnTouchListener((v,e)->{\n            if(overlayLp==null)return false;\n            if(e.getActionMasked()==MotionEvent.ACTION_DOWN){d[0]=e.getRawX();d[1]=e.getRawY();d[2]=overlayLp.x;d[3]=overlayLp.y;overlayLp.gravity=Gravity.TOP|Gravity.START;return true;}\n            if(e.getActionMasked()==MotionEvent.ACTION_MOVE){overlayLp.x=(int)(d[2]+e.getRawX()-d[0]);overlayLp.y=(int)(d[3]+e.getRawY()-d[1]);try{wm.updateViewLayout(overlay,overlayLp);}catch(Throwable ignored){}return true;}return false;\n        });\n    }\n"""
          new2="""    private void makeDraggable(View handle){\n        final float[] d=new float[4];\n        handle.setOnTouchListener((v,e)->{\n            if(overlayLp==null||overlay==null)return false;\n            if(e.getActionMasked()==MotionEvent.ACTION_DOWN){\n                int[] loc=new int[2];overlay.getLocationOnScreen(loc);\n                overlayLp.gravity=Gravity.TOP|Gravity.START;overlayLp.x=loc[0];overlayLp.y=loc[1];\n                try{wm.updateViewLayout(overlay,overlayLp);}catch(Throwable ignored){}\n                d[0]=e.getRawX();d[1]=e.getRawY();d[2]=overlayLp.x;d[3]=overlayLp.y;\n                return true;\n            }\n            if(e.getActionMasked()==MotionEvent.ACTION_MOVE){\n                int screenW=getResources().getDisplayMetrics().widthPixels;\n                int screenH=getResources().getDisplayMetrics().heightPixels;\n                int maxX=Math.max(0,screenW-Math.max(1,overlay.getWidth()));\n                int maxY=Math.max(0,screenH-Math.max(1,overlay.getHeight()));\n                overlayLp.x=clamp((int)(d[2]+e.getRawX()-d[0]),0,maxX);\n                overlayLp.y=clamp((int)(d[3]+e.getRawY()-d[1]),0,maxY);\n                try{wm.updateViewLayout(overlay,overlayLp);}catch(Throwable ignored){}\n                return true;\n            }\n            return e.getActionMasked()==MotionEvent.ACTION_UP;\n        });\n    }\n"""
          if old not in s or old2 not in s: raise SystemExit('drag patch anchors missing')
          p.write_text(s.replace(old,new).replace(old2,new2))
          PY

      - name: Download official OCR models
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p SensarTranslate-Android-v0.1.0/app/src/main/assets/tessdata
          curl -fL --retry 4 --retry-delay 2 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata -o SensarTranslate-Android-v0.1.0/app/src/main/assets/tessdata/eng.traineddata
          curl -fL --retry 4 --retry-delay 2 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ukr.traineddata -o SensarTranslate-Android-v0.1.0/app/src/main/assets/tessdata/ukr.traineddata

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd SensarTranslate-Android-v0.1.0
          gradle :app:assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SensarTranslate-Android-v0.1.0-alpha.apk
          cd ..
          sha256sum SensarTranslate-Android-v0.1.0-alpha.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SensarTranslate-Android-v0.1.0-alpha
          path: SensarTranslate-Android-v0.1.0-alpha.apk
          if-no-files-found: error
          retention-days: 30
