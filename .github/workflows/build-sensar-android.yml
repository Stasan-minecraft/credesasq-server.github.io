name: Build Sensar Android

on:
  push:
    branches: [sensar-android]
    paths:
      - 'android-build/project.part*'
      - '.github/workflows/build-sensar-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install current Android command-line tools
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fL --retry 4 --retry-delay 2 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o /tmp/cmdline-tools.zip
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/cmdline-tools.zip' | sha256sum -c -
          rm -rf /tmp/android-cli && mkdir -p /tmp/android-cli
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android 17 Preview SDK with Android CLI
        shell: bash
        run: |
          set -euxo pipefail
          android --sdk="$ANDROID_SDK_ROOT" sdk install --canary platforms/android-37.0 build-tools/37.0.0 platform-tools
          android --sdk="$ANDROID_SDK_ROOT" sdk list --canary 'platforms/*' || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore and patch project
        shell: bash
        run: |
          set -euxo pipefail
          cat android-build/project.part00 android-build/project.part01 android-build/project.part02 android-build/project.part03 android-build/project.part04 | base64 -d > /tmp/sensar-android.tar.gz
          echo '4a3824f61389aae774b7fbb680feb59b4d3e847dc06e0d87707d430775a54dc0  /tmp/sensar-android.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sensar-android.tar.gz
          sed -i "s/version '8.10.1'/version '9.3.0'/" SensarTranslate-Android-v0.1.0/build.gradle
          sed -i 's/import android.graphics.HardwareBuffer;/import android.hardware.HardwareBuffer;/' SensarTranslate-Android-v0.1.0/app/src/main/java/com/sensar/translate/SensarAccessibilityService.java

      - name: Download official OCR models
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p SensarTranslate-Android-v0.1.0/app/src/main/assets/tessdata
          curl -fL --retry 4 --retry-delay 2 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata -o SensarTranslate-Android-v0.1.0/app/src/main/assets/tessdata/eng.traineddata
          curl -fL --retry 4 --retry-delay 2 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ukr.traineddata -o SensarTranslate-Android-v0.1.0/app/src/main/assets/tessdata/ukr.traineddata

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd SensarTranslate-Android-v0.1.0
          gradle :app:assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SensarTranslate-Android-v0.1.0-alpha.apk
          cd ..
          sha256sum SensarTranslate-Android-v0.1.0-alpha.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SensarTranslate-Android-v0.1.0-alpha
          path: SensarTranslate-Android-v0.1.0-alpha.apk
          if-no-files-found: error
          retention-days: 30
